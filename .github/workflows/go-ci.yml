name: go-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: race + integration-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration-tagged build check
        run: make vet-integration
      - name: Race unit tests
        # Byte-identical to the shared `make test-race` target, which also runs
        # the whole module - internal/agent included. Keep the two in step.
        #
        # This comment used to say the Makefile target EXCLUDED internal/agent for
        # a Windows-only proctree race. That exclusion was removed when the race was
        # fixed (docs/backlog/closed/bug-2026-06-20-agent-proctree-windows-race.md,
        # closed 2026-06-20) and the comment was not. Corrected 2026-08-25.
        run: go test -race ./... -timeout 180s

  cli-integration:
    name: cli integration (real server)
    runs-on: ubuntu-latest
    # DELIBERATELY NOT 15. The `test` job above uses timeout-minutes: 15 and
    # `make test-integration` uses -timeout 900s - the same number - so today a
    # Go panic and a GitHub job kill are indistinguishable in the log. 10
    # minutes here against the target's -timeout 480s means the two failures
    # name themselves.
    timeout-minutes: 10
    services:
      # Same image, user, password and port as web-ci.yml's service and as the
      # relay-postgres container scripts/dev.ps1 manages locally, so
      # postgres://relay:relay@127.0.0.1:5432 is one string in all three.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Setting this selects the harness's shared-service mode: one freshly
      # CREATEd database per test on the service above. No Docker API, no image
      # pull, no Ryuk reaper. The path names `postgres` because
      # pgdsn.newSharedServiceDSN connects there only to issue CREATE/DROP
      # DATABASE; no test ever uses that database.
      #
      # 127.0.0.1, never localhost: localhost can resolve to ::1 first and a
      # published Docker port may not answer there. web/e2e/ensure-db.mjs
      # carries the same note.
      RELAY_TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # A SEPARATE JOB, not a step in `test`. A step would inherit required-check
      # status for free, which is a real advantage, but it would also attach this
      # Postgres service to the race job (making every race run wait on a health
      # check) and put both lanes on one 15-minute clock, which makes worse
      # exactly the ambiguity the timeout above is fixing.
      #
      # This job is ADVISORY, and so is every other job in this repo. Verified
      # 2026-08-27: `main` carries no branch protection and no rulesets, so no
      # check anywhere blocks a merge - a red result reports and nothing more.
      # That is a deliberate choice for a solo repo; the gate is running the
      # lane locally (`make test-cli-integration`) and not merging red. An
      # earlier version of this comment told a human to add the check to
      # branch protection; that was declined on 2026-08-27 in favour of the
      # local-gate convention. Do not re-add that instruction, and do not
      # describe any job here as a "merge gate".
      - name: CLI integration lane (real relay-server, real Postgres)
        run: make test-cli-integration

  pg-integration:
    name: pg integration (store, schedrunner)
    runs-on: ubuntu-latest
    # DELIBERATELY NOT 15, for the reason cli-integration's comment gives: the
    # `test` job above uses timeout-minutes: 15, so equal numbers make a Go
    # panic and a GitHub job kill indistinguishable in the log. 12 here
    # against the target's -timeout 600s means the two failures name
    # themselves - but -timeout 600s is PER TEST BINARY and this target names
    # three packages, so 12 minutes is coupled to those packages running
    # concurrently (no -p 1 in test-pg-integration): a change that serializes
    # them (adding -p 1, or a CI runner with GOMAXPROCS=1) can multiply the
    # worst case past this job's limit.
    timeout-minutes: 12
    services:
      # Same image, user, password and port as cli-integration's service, so
      # postgres://relay:relay@127.0.0.1:5432 is one string across every job
      # in this file.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Selects the shared-service mode in internal/testsupport/pgdsn, the
      # same harness cli-integration uses: one freshly CREATEd database per
      # test on the service above, no Docker API, no image pull, no Ryuk
      # reaper. 127.0.0.1, never localhost, for the same reason
      # cli-integration's env comment gives.
      RELAY_TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # A SEPARATE JOB, not a step in cli-integration, for the same reason
      # cli-integration is its own job rather than a step in `test`: two jobs
      # run concurrently on separate runners, so the wall clock is the max of
      # the two rather than the sum, and a red result names one lane.
      #
      # This job is ADVISORY, like every other job in this repo. `main`
      # carries no branch protection and no rulesets, so no check anywhere
      # blocks a merge - a red result reports and nothing more. Do not
      # describe this job, or any other, as a "merge gate".
      - name: Postgres integration lanes (internal/store, internal/schedrunner)
        run: make test-pg-integration
