name: go-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

# PLATFORM COVERAGE. A linux runner executes the linux arm of a runtime.GOOS
# branch and compiles the files a linux build constraint admits. The `test`
# job's cross-compile step type-checks the windows arm and runs nothing of it,
# so a platform-conditional branch written for Windows gets compilation from
# this file, not behaviour.
jobs:
  test:
    name: race + integration-build
    # Platform: linux. Compiles and runs the linux arm; cross-compiles, and
    # does not run, the windows arm.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration-tagged build check
        run: make vet-integration
      - name: Race unit tests
        # Byte-identical to the shared `make test-race` target, which also runs
        # the whole module - internal/agent included. Keep the two in step.
        #
        # This comment used to say the Makefile target EXCLUDED internal/agent for
        # a Windows-only proctree race. That exclusion was removed when the race was
        # fixed (docs/backlog/closed/bug-2026-06-20-agent-proctree-windows-race.md,
        # closed 2026-06-20) and the comment was not. Corrected 2026-08-25.
        run: go test -race ./... -timeout 180s
      - name: Windows cross-compile check
        # This runner is linux, so a linux build cannot see a //go:build
        # windows file: a type error or an unused import in one is invisible
        # to a step that builds for linux. Cross-compiling type-checks it, and
        # runs nothing, so it says nothing about behaviour.
        #
        # No line below is redundant with another. `go build` does not read
        # _test.go files, so the plain vet line is what reaches the
        # windows-constrained test files. Neither untagged line compiles a
        # `//go:build windows && integration` file, and `make vet-integration`
        # builds for linux, so the tagged vet line is what reaches that
        # combination. TestWindowsCrossCompileStepCommandsArePresent goes RED
        # if any of them is deleted.
        #
        # Ordered after the race step deliberately: `run: |` executes under
        # `bash -e`, so a windows type error here aborts the job, and running
        # this first leaves the race step unrun.
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./...
          GOOS=windows go vet -tags integration ./...

  cli-integration:
    name: cli integration (real server)
    # Platform: linux. Compiles and runs the linux arm only.
    runs-on: ubuntu-latest
    # DELIBERATELY NOT 15. The `test` job above uses timeout-minutes: 15 and
    # `make test-integration` uses -timeout 900s - the same number - so today a
    # Go panic and a GitHub job kill are indistinguishable in the log. 10
    # minutes here against the target's -timeout 480s means the two failures
    # name themselves.
    timeout-minutes: 10
    services:
      # Same image, user, password and port as web-ci.yml's service and as the
      # relay-postgres container scripts/dev.ps1 manages locally, so
      # postgres://relay:relay@127.0.0.1:5432 is one string in all three.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Setting this selects the harness's shared-service mode: one freshly
      # CREATEd database per test on the service above. No Docker API, no image
      # pull, no Ryuk reaper. The path names `postgres` because
      # pgdsn.newSharedServiceDSN connects there only to issue CREATE/DROP
      # DATABASE; no test ever uses that database.
      #
      # 127.0.0.1, never localhost: localhost can resolve to ::1 first and a
      # published Docker port may not answer there. web/e2e/ensure-db.mjs
      # carries the same note.
      RELAY_TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # A SEPARATE JOB, not a step in `test`. A step would inherit required-check
      # status for free, which is a real advantage, but it would also attach this
      # Postgres service to the race job (making every race run wait on a health
      # check) and put both lanes on one 15-minute clock, which makes worse
      # exactly the ambiguity the timeout above is fixing.
      #
      # This job is ADVISORY, and so is every other job in this repo. Verified
      # 2026-08-27: `main` carries no branch protection and no rulesets, so no
      # check anywhere blocks a merge - a red result reports and nothing more.
      # That is a deliberate choice for a solo repo; the gate is running the
      # lane locally (`make test-cli-integration`) and not merging red. An
      # earlier version of this comment told a human to add the check to
      # branch protection; that was declined on 2026-08-27 in favour of the
      # local-gate convention. Do not re-add that instruction, and do not
      # describe any job here as a "merge gate".
      - name: CLI integration lane (real relay-server, real Postgres)
        run: make test-cli-integration

  pg-integration:
    name: pg integration (store, schedrunner, relay-server, worker, scheduler, mcp, agent, pgdsn)
    # Platform: linux. Compiles and runs the linux arm only.
    runs-on: ubuntu-latest
    # DELIBERATELY NOT 15, for the reason cli-integration's comment gives: the
    # `test` job above uses timeout-minutes: 15, so equal numbers make a Go
    # panic and a GitHub job kill indistinguishable in the log. 12 here
    # against the target's -timeout 600s means the two failures name
    # themselves - but -timeout 600s is PER TEST BINARY and this target names
    # eight packages, grown from four when internal/worker, internal/scheduler,
    # internal/mcp and internal/agent joined (internal/agent contributes zero
    # database acquisitions - see test-pg-integration's own comment for why it
    # is here at all), so 12 minutes is coupled to those packages running
    # concurrently (no -p 1 in test-pg-integration): a change that serializes
    # them (adding -p 1, or a CI runner with GOMAXPROCS=1) can multiply the
    # worst case past this job's limit.
    timeout-minutes: 12
    services:
      # Same image, user, password and port as cli-integration's service, so
      # postgres://relay:relay@127.0.0.1:5432 is one string across every job
      # in this file.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Selects the shared-service mode in internal/testsupport/pgdsn, the
      # same harness cli-integration uses: one freshly CREATEd database per
      # test on the service above, no Docker API, no image pull, no Ryuk
      # reaper. 127.0.0.1, never localhost, for the same reason
      # cli-integration's env comment gives.
      RELAY_TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # A SEPARATE JOB, not a step in cli-integration, for the same reason
      # cli-integration is its own job rather than a step in `test`: two jobs
      # run concurrently on separate runners, so the wall clock is the max of
      # the two rather than the sum, and a red result names one lane.
      #
      # This job is ADVISORY, like every other job in this repo. `main`
      # carries no branch protection and no rulesets, so no check anywhere
      # blocks a merge - a red result reports and nothing more. Do not
      # describe this job, or any other, as a "merge gate".
      - name: Postgres integration lanes (internal/store, internal/schedrunner, cmd/relay-server, internal/worker, internal/scheduler, internal/mcp, internal/agent, internal/testsupport/pgdsn)
        run: make test-pg-integration

  api-integration:
    name: api integration (internal/api)
    # Platform: linux. Compiles and runs the linux arm only.
    runs-on: ubuntu-latest
    # ITS OWN JOB, not folded into pg-integration above: internal/api alone
    # runs about 1.8x that job's combined package acquisition count, so
    # putting it there would not fit pg-integration's own timeout argument, it
    # would replace it with one nobody has measured for a package this size.
    # Two jobs on separate runners also make the wall clock the max rather
    # than the sum, which is the same reason cli-integration and
    # pg-integration are already separate jobs rather than steps in one.
    #
    # timeout-minutes: 10, NOT equal to the target's own -timeout 1800s -
    # THIS INVERSION IS DELIBERATE, READ BEFORE "FIXING" IT. In the other two
    # jobs the Go timeout is BELOW the job timeout, so a Go panic and a
    # GitHub kill name themselves independently. Here it is the other way
    # round: make test-api-integration's -timeout 1800s is sized for
    # container mode (a developer with Docker and no
    # RELAY_TEST_DATABASE_URL), while this job runs in shared-service mode at
    # roughly a third of that cost. The property that matters is that the two
    # numbers are not EQUAL: in CI the job-level kill always wins and is
    # therefore unambiguous, and locally the Go timeout is the correct one for
    # the mode a human is in.
    timeout-minutes: 10
    services:
      # Same image, user, password and port as cli-integration's and
      # pg-integration's service, so postgres://relay:relay@127.0.0.1:5432 is
      # one string across every job in this file.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Selects the shared-service mode in internal/testsupport/pgdsn, the
      # same harness the other two Postgres jobs use. 127.0.0.1, never
      # localhost, for the same reason cli-integration's env comment gives.
      RELAY_TEST_DATABASE_URL: postgres://relay:relay@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # This job is ADVISORY, like every other job in this repo. `main`
      # carries no branch protection and no rulesets, so no check anywhere
      # blocks a merge - a red result reports and nothing more. Do not
      # describe this job, or any other, as a "merge gate".
      - name: API integration lane (internal/api)
        run: make test-api-integration
